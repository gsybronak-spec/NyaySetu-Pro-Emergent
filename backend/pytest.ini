[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -v --tb=short

env =
    ENVIRONMENT=test
    MONGO_URL=mongodb://localhost:27017/nyaysetu_test
    DB_NAME=nyaysetu_test
    TEMPLATE_AUTO_SEED=false
    JWT_SECRET=test-secret-1234567890-test-secret
    ADMIN_SEED_EMAIL=admin@nyaysetu.com
